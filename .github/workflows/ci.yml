# Garde principal : la branche ne compile-t-elle pas, ou un test échoue-t-il ?
# C'est le seul workflow qu'il est raisonnable de rendre obligatoire sur `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build et tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines.node` déclare >=20 : les deux bornes utiles sont couvertes.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Zéro dépendance runtime (§10) : `npm ci` n'installe que l'outillage de
      # développement, et échoue si le lockfile a divergé du manifeste.
      - name: Installer les dépendances
        run: npm ci

      - name: Compiler tous les paquets (tsc strict, composite)
        run: npm run build

      - name: Suite de tests (vitest)
        run: npm test
