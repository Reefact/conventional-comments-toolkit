# Garde principal : la branche ne compile-t-elle pas, ou un test échoue-t-il ?
# C'est le seul workflow qu'il est raisonnable de rendre obligatoire sur `main`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build et tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines.node` déclare >=20 : les deux bornes utiles sont couvertes.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Zéro dépendance runtime (§10) : `npm ci` n'installe que l'outillage de
      # développement, et échoue si le lockfile a divergé du manifeste.
      - name: Installer les dépendances
        run: npm ci

      - name: Compiler tous les paquets (tsc strict, composite)
        run: npm run build

      - name: Suite de tests (vitest)
        run: npm test

  docker-image:
    name: Image Docker du composant B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t cct-server .

      # L'image est sondée dans SA configuration livrée : stockage fichier sur /data
      # avec un volume — pas une configuration de test qui neutraliserait FileStorage,
      # les droits de l'utilisateur non-root sur /data et la sonde HEALTHCHECK.
      - name: Démarrer et sonder le conteneur (configuration livrée)
        run: |
          docker volume create cct-ci-data
          docker run -d --name cct \
            -p 18080:8080 \
            -v cct-ci-data:/data \
            -e CCT_ADMIN_TOKEN=ci-token \
            -e CCT_GITHUB_TOKEN=x \
            -e CCT_GITHUB_WEBHOOK_SECRET=y \
            cct-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin/exemption-log)
          [ "$code" = "401" ] || { echo "admin sans jeton devrait rendre 401, a rendu $code"; exit 1; }
          # Avec le jeton : 200 — la route lit le stockage, donc /data est réellement
          # inscriptible et lisible par l'utilisateur non-root.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/admin/exemption-log)
          [ "$code" = "200" ] || { echo "admin avec jeton devrait rendre 200, a rendu $code"; exit 1; }
          # L'état du fichier a bien été écrit sur le volume (sonde d'écriture au boot).
          docker run --rm -v cct-ci-data:/data alpine test -s /data/storage.json

      - name: Verdict du HEALTHCHECK embarqué
        run: |
          for i in $(seq 1 12); do
            status=$(docker inspect cct --format '{{.State.Health.Status}}')
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          [ "$status" = "healthy" ] || { echo "HEALTHCHECK: $status"; exit 1; }

      - name: Arrêt propre (SIGTERM → exit 0)
        run: |
          docker stop cct
          exit_code=$(docker inspect cct --format '{{.State.ExitCode}}')
          [ "$exit_code" = "0" ] || { echo "arrêt non propre: exit $exit_code"; exit 1; }

      - name: Journaux du conteneur (toujours — c'est le diagnostic en cas d'échec)
        if: always()
        run: docker logs cct || true
