# Canari hebdomadaire (scripts/check-github-selectors-live.mjs) : chaque chaîne de
# packages/adapters/github/src/selectors.ts qu'une page PUBLIQUE de github.com doit satisfaire
# y trouve-t-elle encore quelque chose ? Les tests sur pages capturées figent la page d'un jour ;
# ce job dit quand le vrai site s'en éloigne. Sans session : les zones de saisie et leurs
# boutons, qui n'existent que pour une personne connectée, n'y sont PAS vérifiés
# (scripts/lib/selector-canary.mjs).
name: Canari des sélecteurs GitHub

on:
  schedule:
    # 09:33 UTC le lundi — décalé du canari des variables de thème (09:03).
    - cron: '33 9 * * 1'
  pull_request:
    paths:
      - 'packages/adapters/github/src/selectors.ts'
      - 'scripts/check-github-selectors-live.mjs'
      - 'scripts/lib/selector-canary.mjs'
      - '.github/workflows/github-selectors-canary.yml'
  workflow_dispatch:

concurrency:
  group: github-selectors-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Sélecteurs GitHub toujours satisfaits sur github.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Résoudre le binaire Chromium
        run: |
          path=$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath());")
          echo "PLAYWRIGHT_CHROMIUM=$path" >> "$GITHUB_ENV"
          echo "Chromium : $path"

      # Le canari lit les sélecteurs COMPILÉS.
      - run: npm run build

      - name: Évaluer les chaînes de sélecteurs sur des pages publiques
        id: check
        run: npm run check:github-selectors-live

      # Le job rouge suffit pour une PR ; sur le cron hebdomadaire, personne ne regarde
      # l'onglet Actions chaque semaine — on ouvre donc (ou met à jour) une issue de
      # suivi pour que la notification GitHub standard (email/mobile) prévienne le
      # mainteneur, sans dépendre d'un webhook ou d'un secret supplémentaire.
      #
      # Gardé sur la sortie `drift` du step (positionnée par le script LUI-MÊME, seulement
      # quand il a réellement évalué les chaînes et que l'une n'a rien trouvé), pas sur
      # failure()/outcome() du step : ceux-ci restent vrais aussi bien après un échec en
      # amont (npm ci, build, installation de Chromium) qu'après une panne de navigation
      # (réseau, page qui ne répond pas 200) — dans ces cas, aucune chaîne n'a été évaluée,
      # et ouvrir une issue qui affirme « des chaînes ne trouvent plus rien » serait un faux
      # diagnostic.
      - name: Ouvrir ou mettre à jour l'issue de suivi
        if: always() && github.event_name == 'schedule' && steps.check.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Sélecteurs GitHub : des chaînes ne trouvent plus rien sur github.com';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Le canari hebdomadaire (`.github/workflows/github-selectors-canary.yml`) a évalué',
              'les chaînes de `packages/adapters/github/src/selectors.ts` sur des pages publiques',
              'de github.com, et au moins une n\'y a trouvé aucun élément.',
              '',
              `Chaînes et pages concernées : ${runUrl}`,
              '',
              'Une capture de la page, extension désactivée, dit ce qu\'elle porte désormais',
              '(`npm run check:captured-pages -- --redact` avant tout commit). Corriger les',
              'candidats, ajouter la capture aux fixtures, puis fermer cette issue.',
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'github-selectors-canary',
                color: 'b60205',
                description: "Créée/mise à jour par le canari des sélecteurs GitHub",
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = le label existe déjà
            }

            const { data: labelled } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'github-selectors-canary',
            });

            // L'API issues renvoie AUSSI les pull requests : une PR portant ce label (la
            // PR qui corrige justement une dérive détectée, typiquement) pourrait être
            // choisie comme « issue existante » et recevoir le commentaire de statut à la
            // place de l'issue de suivi. On ne garde donc que les vraies issues.
            const existing = labelled.filter((item) => !item.pull_request);

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Toujours en échec : ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['github-selectors-canary'],
              });
            }
