# Chemin d'installation SANS chaîne de build locale : sur un tag `vX.Y.Z`, ce workflow
# construit le bundle MV3 et publie une Release GitHub contenant deux zips prêts à
# charger — un pour Chromium, un pour Firefox. L'utilisateur n'a plus qu'à télécharger,
# décompresser et charger le dossier dans son navigateur : ni Node, ni npm, ni Git.
#
# Les mêmes gardes que `extension-package.yml` s'appliquent avant publication (aucun code
# distant §10, manifestes chargeables) : ce qui est publié est ce qui a été vérifié.
name: Release (zip installable)

on:
  push:
    tags: ['v*']
  # Répétition à blanc : produit les zips en artefacts de run, sans rien publier.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Construire, vérifier et publier les zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Le tag est ce que l'utilisateur voit ; `manifest.json` est ce que le navigateur
      # affiche une fois l'extension chargée. Les deux qui divergent, c'est un ticket de
      # support garanti — la garde est donc bloquante, et dit quoi corriger. Une
      # pré-version (`v1.1.0-rc.1`) fait exception dans un seul sens : l'étiquette reste
      # hors du manifeste, que Chromium n'accepte qu'entièrement numérique. Le détail, et
      # les cas d'erreur, sont dans `scripts/release-version.mjs` et ses tests.
      - name: Version publiée (le tag doit correspondre au manifeste)
        id: version
        run: |
          # pipefail : sans lui, l'échec de la garde serait masqué par le succès de `tee`.
          set -o pipefail
          node scripts/release-version.mjs "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Compiler les paquets
        run: npm run build

      # Un tag se pose parfois sur un commit qui n'a jamais vu la CI : on ne publie pas un
      # bundle dont on n'a pas rejoué les tests.
      - name: Suite de tests (vitest)
        run: npm test

      - name: Empaqueter (esbuild → dist-ext/, variante Firefox comprise)
        run: npm run build:extension

      # §10 : « aucun code distant, aucune dépendance CDN ». Vérifié ici aussi : une
      # release est justement ce que personne ne relira avant de l'installer.
      - name: Aucun chargement distant dans le bundle (§10)
        run: |
          cd packages/extension/dist-ext
          if grep -rInE '(from|import)[^;]*["'"'"']https?://' content.js background.js options.js; then
            echo "::error::Import distant détecté dans le bundle : la CSP MV3 l'interdit (§10)."
            exit 1
          fi
          echo "✓ aucun import distant"

      - name: Manifestes valides et cohérents
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const base = JSON.parse(readFileSync('packages/extension/dist-ext/manifest.json', 'utf8'));
            const ff = JSON.parse(readFileSync('packages/extension/dist-ext/firefox/manifest.json', 'utf8'));
            if (base.manifest_version !== 3) throw new Error('manifest_version attendu : 3');
            if (base.version !== process.env.CORE) throw new Error('version du bundle: ' + base.version);
            if (!ff.browser_specific_settings?.gecko?.id) throw new Error('variante Firefox sans identifiant gecko');
            if (!Array.isArray(ff.background?.scripts)) throw new Error('Firefox attend une event page, pas un service worker');
            console.log('✓ manifestes MV3 valides (Chromium et Firefox)');
          "
        env:
          # Le noyau numérique, pas la version annoncée : une pré-version porte une
          # étiquette que le manifeste ne peut pas déclarer.
          CORE: ${{ steps.version.outputs.core }}

      # Deux archives distinctes : `dist-ext/` contient le sous-dossier `firefox/`, que
      # Chromium n'a aucune raison d'embarquer. Chaque zip se décompresse en UN dossier
      # dont la racine porte `manifest.json` — c'est ce dossier que le navigateur attend.
      - name: Composer les archives
        id: zips
        env:
          CHROMIUM: ${{ steps.version.outputs.chromium }}
          FIREFOX: ${{ steps.version.outputs.firefox }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release"
          rm -rf "$work" && mkdir -p "$work"
          src=packages/extension/dist-ext

          cp -R "$src" "$work/conventional-comments-toolkit"
          rm -rf "$work/conventional-comments-toolkit/firefox"
          cp -R "$src/firefox" "$work/conventional-comments-toolkit-firefox"

          for dir in "$work/conventional-comments-toolkit" "$work/conventional-comments-toolkit-firefox"; do
            cp "$GITHUB_WORKSPACE/LICENSE" "$dir/LICENSE"
            cat > "$dir/INSTALLATION.txt" <<EOF
          Conventional Comments Toolkit — extension navigateur, version $VERSION

          FR — Installation (aucune installation de Node, npm ou Git nécessaire)

            Chrome / Edge / navigateur Chromium
              1. Décompressez cette archive quelque part de durable (pas dans le dossier
                 des téléchargements : le navigateur relit ce dossier à chaque démarrage,
                 le supprimer désactive l'extension).
              2. Ouvrez chrome://extensions (ou edge://extensions).
              3. Activez le « Mode développeur » (en haut à droite).
              4. Cliquez « Charger l'extension non empaquetée » et sélectionnez le dossier
                 décompressé — celui qui contient directement manifest.json.

            Firefox (utilisez l'archive ...-firefox.zip)
              1. Décompressez l'archive.
              2. Ouvrez about:debugging#/runtime/this-firefox.
              3. « Charger un module temporaire… », puis sélectionnez le fichier
                 manifest.json du dossier décompressé.
              Note : un module temporaire est retiré à la fermeture de Firefox.

            Vérification : ouvrez une Pull Request sur github.com et cliquez dans un champ
            de commentaire — une barre d'outils de labels doit apparaître au-dessus.

          EN — Installation (no Node, npm or Git required)

            Chrome / Edge / any Chromium browser
              1. Unzip this archive somewhere permanent (not your Downloads folder: the
                 browser re-reads that folder at every start, deleting it disables the
                 extension).
              2. Open chrome://extensions (or edge://extensions).
              3. Turn on "Developer mode" (top right).
              4. Click "Load unpacked" and pick the unzipped folder — the one that directly
                 contains manifest.json.

            Firefox (use the ...-firefox.zip archive)
              1. Unzip the archive.
              2. Open about:debugging#/runtime/this-firefox.
              3. "Load Temporary Add-on...", then select the manifest.json file inside the
                 unzipped folder.
              Note: a temporary add-on is removed when Firefox closes.

            Check: open a Pull Request on github.com and click into a comment field — a
            label toolbar should appear above it.

          Documentation : https://github.com/$GITHUB_REPOSITORY
          Licence : Apache-2.0 (voir LICENSE)
          EOF
          done

          ( cd "$work" && zip -qr "$CHROMIUM" conventional-comments-toolkit )
          ( cd "$work" && zip -qr "$FIREFOX" conventional-comments-toolkit-firefox )
          ( cd "$work" && sha256sum "$CHROMIUM" "$FIREFOX" > SHA256SUMS.txt )

          echo "dir=$work" >> "$GITHUB_OUTPUT"
          ls -l "$work"
          cat "$work/SHA256SUMS.txt"

      # Le zip doit se décompresser en un dossier chargeable tel quel : un manifest.json
      # enterré d'un niveau de trop est l'erreur classique, et elle ne se voit qu'au
      # moment où quelqu'un essaie de charger l'extension.
      - name: L'archive se décompresse en un dossier chargeable
        env:
          CHROMIUM: ${{ steps.version.outputs.chromium }}
          FIREFOX: ${{ steps.version.outputs.firefox }}
          WORK: ${{ steps.zips.outputs.dir }}
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/verify"
          rm -rf "$check" && mkdir -p "$check"
          ( cd "$check" && unzip -q "$WORK/$CHROMIUM" && unzip -q "$WORK/$FIREFOX" )
          for dir in conventional-comments-toolkit conventional-comments-toolkit-firefox; do
            for file in manifest.json content.js background.js options.js options.html styles.css INSTALLATION.txt; do
              test -s "$check/$dir/$file" || { echo "::error::$dir/$file manquant ou vide dans l'archive"; exit 1; }
            done
          done
          test ! -e "$check/conventional-comments-toolkit/firefox" \
            || { echo "::error::l'archive Chromium embarque la variante Firefox"; exit 1; }
          echo "✓ les deux archives se décompressent en un dossier chargeable"

      # Toujours publiés en artefacts de run : c'est ce qui rend la répétition à blanc
      # (workflow_dispatch) utile, et ce qui reste récupérable si la Release échoue.
      - name: Publier les archives en artefacts de run
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.zips.outputs.dir }}/*.zip
            ${{ steps.zips.outputs.dir }}/SHA256SUMS.txt
          retention-days: 30

      - name: Créer la Release GitHub et y attacher les archives
        # Une exécution manuelle reste une répétition à blanc, même lancée depuis un tag.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CHROMIUM: ${{ steps.version.outputs.chromium }}
          FIREFOX: ${{ steps.version.outputs.firefox }}
          WORK: ${{ steps.zips.outputs.dir }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## Installation sans chaîne de build"
            echo
            echo "Aucun Node, npm ni Git requis : télécharger l'archive, la décompresser, charger le dossier."
            echo
            echo "| Navigateur | Archive | Comment charger |"
            echo "|---|---|---|"
            echo "| Chrome, Edge, Chromium | \`$CHROMIUM\` | \`chrome://extensions\` → Mode développeur → **Charger l'extension non empaquetée** → le dossier décompressé |"
            echo "| Firefox | \`$FIREFOX\` | \`about:debugging#/runtime/this-firefox\` → **Charger un module temporaire** → le \`manifest.json\` du dossier décompressé |"
            echo
            echo "Décompressez ailleurs que dans le dossier des téléchargements : Chromium relit ce dossier à chaque démarrage, le supprimer désactive l'extension. Sous Firefox, un module temporaire est retiré à la fermeture du navigateur."
            echo
            echo "Chaque archive contient un \`INSTALLATION.txt\` reprenant ces étapes (FR et EN). Guide détaillé : [\`docs/extension-setup-fr.md\`](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/extension-setup-fr.md) (EN : [\`docs/extension-setup-en.md\`](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/extension-setup-en.md))."
            echo
            echo "L'extension démarre en mode \`assist\` : elle aide et signale, elle ne bloque jamais l'envoi. La source de vérité reste le compagnon serveur (composant B)."
            echo
            echo "### Empreintes SHA-256"
            echo
            echo '```'
            cat "$WORK/SHA256SUMS.txt"
            echo '```'
            echo
            echo "Construit depuis \`$GITHUB_SHA\` — bundle vérifié sans code distant (§10), manifestes MV3 Chromium et Firefox chargeables, suite de tests rejouée."
          } > "$notes"

          prerelease=''
          if [ "$PRERELEASE" = 'true' ]; then prerelease='--prerelease'; fi

          gh release create "$TAG" \
            --title "Conventional Comments Toolkit $VERSION" \
            --notes-file "$notes" \
            --verify-tag \
            $prerelease \
            "$WORK/$CHROMIUM" "$WORK/$FIREFOX" "$WORK/SHA256SUMS.txt"
