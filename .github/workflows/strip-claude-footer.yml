# Retire de la description d'une PR le pied d'attribution d'une session Claude Code
# (décision du propriétaire, 2026-11-10). Le pourquoi et les formes reconnues sont en tête de
# `scripts/lib/claude-footer.mjs`.
#
# `pull_request_target` plutôt que `pull_request` : c'est le seul déclencheur dont le jeton
# peut écrire sur une PR venue d'un fork. Il n'est sûr ici QUE parce que ce workflow
# n'exécute jamais le code de la PR : le checkout par défaut de `pull_request_target` est la
# branche de BASE, et seule la description — une donnée — est lue. Ne jamais y ajouter
# `ref: ${{ github.event.pull_request.head.sha }}`.
#
# Pas de boucle : une modification faite avec le `GITHUB_TOKEN` ne déclenche aucun workflow.
name: Pied Claude Code

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: strip-claude-footer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip:
    if: contains(github.event.pull_request.body, 'Claude Code') || contains(github.event.pull_request.body, 'claude.ai/code/session_')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lib/claude-footer.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { stripClaudeFooter } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/lib/claude-footer.mjs`
            );
            // La description COURANTE, pas celle de l'événement : une modification survenue
            // entre-temps ne doit pas être écrasée par une version périmée.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const body = pr.body ?? '';
            const cleaned = stripClaudeFooter(body);
            if (cleaned === body) {
              core.info('Aucun pied Claude Code en fin de description.');
              return;
            }
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: cleaned,
            });
            core.info('Pied Claude Code retiré de la description.');
